---
- name: Write BioShell version file
  copy:
    dest: /etc/bioshell-version
    content: "{{ bioshell_version | default('dev') }}\n"
    owner: root
    group: root
    mode: '0644'

- name: Install BioShell MOTD banner script
  copy:
    src: 99-bioshell
    dest: /etc/update-motd.d/99-bioshell
    owner: root
    group: root
    mode: '0755'

- name: Strip execute bit from noisy default MOTD scripts
  file:
    path: "/etc/update-motd.d/{{ item }}"
    mode: '0644'
  loop:
    - 10-help-text
    - 50-motd-news
    - 80-esm
    - 91-release-upgrade
  ignore_errors: true

- name: Ensure pam_motd renders /run/motd.dynamic for ssh sessions
  lineinfile:
    path: /etc/pam.d/sshd
    regexp: '^\s*session\s+optional\s+pam_motd\.so\s+motd='
    line: 'session    optional     pam_motd.so  motd=/run/motd.dynamic'
    state: present
