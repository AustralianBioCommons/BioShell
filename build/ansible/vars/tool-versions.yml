# ============================================================
# Tool versions — update here, everything else follows
# ============================================================
singularity_version: "4.5.0"
singularity_prefix: "/opt/singularity"

shpc_version: "0.1.33"

go_version: "1.26.4"
os: "linux"
arch: "amd64"

ansible_target_version: "2.16.3"

java_version: "21"
nextflow_version: "26.04.6"
nfcore_version: "4.0.2"

rstudio_version_full: "2026.06.0-242"
rstudio_version: "2026.06.0"

# downloads.globus.org only serves "latest" - this is the version we last
# tested against; the role warns if upstream has moved past this pin.
globus_connect_personal_version: "3.2.9"

# Each platform file overrides this proxy variable
cvmfs_quota_limit: 4096
cvmfs_proxy: "DIRECT"
cvmfs_repositories: "data.galaxyproject.org,singularity.galaxyproject.org"
cvmfs_biocommons_url: "http://bcws.test.aarnet.edu.au/cvmfs/@fqrn@"

# Module paths
module_base_apps: "/apps/Modules/modulefiles"
module_base_opt: "/opt/Modules/modulefiles"

# Common tools
snakemake_version: "7.32.4"
r_version: "4.3.3"
jupyter_version: "2026.07"